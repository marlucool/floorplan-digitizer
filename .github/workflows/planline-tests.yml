name: Planline API tests

on:
  push:
    branches: [main, "feat/planline-web-integration"]
  pull_request:
    branches: [main, "feat/geometry-snapping"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run API tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_*.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/ocr-studio.js
          node --check web/settings.js
          node --check web/dashboard.js

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install browser test dependencies
        run: python -m pip install -r requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser UI tests
        run: python -m pytest -q tests/e2e
