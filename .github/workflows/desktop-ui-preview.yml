name: Desktop UI preview

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_ui_preview.py"
      - "tests/test_ui_preview.py"
      - ".github/workflows/desktop-ui-preview.yml"
      - "README.md"
  pull_request:
    paths:
      - "web/**"
      - "scripts/build_ui_preview.py"
      - "tests/test_ui_preview.py"
      - "tests/e2e/test_static_preview.py"
      - ".github/workflows/desktop-ui-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: planline-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build static desktop UI preview
        run: python scripts/build_ui_preview.py --output _site

      - name: Check preview JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/preview.js

      - name: Install preview test dependencies
        run: python -m pip install pytest

      - name: Test preview package
        run: python -m pytest tests/test_ui_preview.py -q

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  preview-browser:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install browser test dependencies
        run: |
          python -m pip install pytest playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test preview in Chromium
        run: python -m pytest -q tests/e2e/test_static_preview.py

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
