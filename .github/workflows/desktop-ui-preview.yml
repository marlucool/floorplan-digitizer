name: Desktop UI preview

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  workflow_dispatch:

# The build job only reads repository/PR data. Publishing and commenting use
# separate jobs with narrowly scoped write permissions.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: planline-pages
  cancel-in-progress: false

jobs:

  ensure-preview-label:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create the preview label if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name --jq '[.[] | select(.name == "preview")] | length')"
          if [[ "$existing" == "0" ]]; then
            gh label create preview --repo "$GITHUB_REPOSITORY" --color "0E8A16" --description "Publish a static Planline UI preview for this pull request"
          fi
  build:
    if: >-
      github.event_name != 'pull_request_target' ||
      contains(github.event.pull_request.labels.*.name, 'preview') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      pages: read
    steps:
      - name: Check out trusted default-branch build tooling
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the main-branch website
        run: python scripts/build_ui_preview.py --output _site

      - name: Build previews for every open PR labelled preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/pr-preview
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label preview --limit 1000 --json number,headRepository)"
          count=0

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            source_repo="$(jq -r '.headRepository.nameWithOwner // ""' <<<"$pr")"

            # Only publish branches from this repository. This avoids fetching
            # arbitrary fork commits with the Pages deployment workflow.
            if [[ "$source_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "Skipping PR #$number: head repository is '$source_repo', not '$GITHUB_REPOSITORY'."
              continue
            fi

            echo "Building static preview for PR #$number"
            git fetch --no-tags --depth=1 origin "refs/pull/$number/head"
            tmp="$(mktemp -d)"
            mkdir -p "$tmp/scripts"
            cp scripts/build_ui_preview.py "$tmp/scripts/"
            git archive --format=tar FETCH_HEAD web | tar -xf - -C "$tmp"

            destination="$GITHUB_WORKSPACE/_site/pr-preview/$number"
            python "$tmp/scripts/build_ui_preview.py" --output "$destination"
            test -s "$destination/index.html"
            test -s "$destination/app.js"
            test -s "$destination/preview.js"
            node --check "$destination/app.js"
            node --check "$destination/preview.js"
            rm -rf "$tmp"
            count=$((count + 1))
          done < <(jq -c '.[]' <<<"$prs")

          echo "Built $count labelled PR preview(s)."

      - name: Check main preview JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/preview.js

      - name: Install preview test dependencies
        run: python -m pip install pytest

      - name: Test static preview builder
        run: python -m pytest tests/test_ui_preview.py -q

      - name: Install browser test dependencies
        run: python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Smoke-test the main preview in Chromium
        run: python -m pytest -q tests/e2e/test_static_preview.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.result == 'success'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy main site and all active PR previews
        id: deployment
        uses: actions/deploy-pages@v4

  update-pr-preview-comment:
    if: >-
      github.event_name == 'pull_request_target' &&
      (
        contains(github.event.pull_request.labels.*.name, 'preview') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      )
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add or update the PR preview link
        uses: actions/github-script@v7
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- planline-pr-preview -->';
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map(label => label.name);
            const active = context.payload.action !== 'closed' && labels.includes('preview');
            const baseUrl = (process.env.PAGES_URL || '').replace(/\/$/, '');
            const previewUrl = `${baseUrl}/pr-preview/${pr.number}/`;
            const body = active
              ? `${marker}
            ## Planline preview
            [Open the preview for PR #${pr.number}](${previewUrl})

            Automatically refreshed from commit \`${pr.head.sha.slice(0, 12)}\`.
            The preview is static: uploads, OCR, model inference and backend operations are disabled.`
              : `${marker}
            ## Planline preview
            This preview is no longer published because the \`preview\` label was removed or the pull request was closed.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else if (active) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
