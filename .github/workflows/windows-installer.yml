name: Windows installer

on:
  push:
    branches:
      - feature/desktop-ocr-studio
    tags:
      - "planline-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Planline Setup for Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package the complete application source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          git archive --format=zip --output=artifacts/planline-source.zip HEAD
          if (!(Test-Path artifacts/planline-source.zip)) {
            throw "The Planline source archive was not created."
          }

      - name: Publish the single-file installer
        shell: pwsh
        run: |
          $sourceZip = (Resolve-Path artifacts/planline-source.zip).Path
          $publishArgs = @(
            "publish",
            "packaging/windows/Planline.Setup.csproj",
            "--configuration", "Release",
            "--runtime", "win-x64",
            "--self-contained", "true",
            "-p:PublishSingleFile=true",
            "-p:IncludeNativeLibrariesForSelfExtract=true",
            "-p:DebugType=None",
            "-p:DebugSymbols=false",
            "-p:PlanlineSourceZip=$sourceZip",
            "--output", "dist"
          )
          dotnet @publishArgs

          $installer = "dist/Planline.Setup.exe"
          if (!(Test-Path $installer)) {
            throw "dotnet publish did not produce Planline.Setup.exe."
          }

          Copy-Item $installer "dist/Planline-Setup.exe" -Force
          $size = (Get-Item "dist/Planline-Setup.exe").Length
          if ($size -lt 1000000) {
            throw "The installer is unexpectedly small ($size bytes)."
          }
          Get-FileHash "dist/Planline-Setup.exe" -Algorithm SHA256

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: Planline-Setup-windows-x64
          path: dist/Planline-Setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installer to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/planline-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the Windows installer
        uses: actions/download-artifact@v7
        with:
          name: Planline-Setup-windows-x64
          path: release-assets

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Planline-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
